version: "2"

# Каждый ограниченный контекст владеет своими запросами и своим сгенерированным
# пакетом в infra/postgres. Схема одна на всех (goose-миграции в db/migrations).
# Новый контекст = новый блок в sql; общие настройки go берутся якорем &go.
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/auth/infra/postgres/queries
    gen:
      go: &go
        package: sqlcgen
        out: internal/auth/infra/postgres/sqlcgen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true

  - engine: postgresql
    schema: db/migrations
    queries: internal/tenant/infra/postgres/queries
    gen:
      go:
        <<: *go
        out: internal/tenant/infra/postgres/sqlcgen

  - engine: postgresql
    schema: db/migrations
    queries: internal/bot/infra/postgres/queries
    gen:
      go:
        <<: *go
        out: internal/bot/infra/postgres/sqlcgen

  - engine: postgresql
    schema: db/migrations
    queries: internal/conversation/infra/postgres/queries
    gen:
      go:
        <<: *go
        out: internal/conversation/infra/postgres/sqlcgen
